    watchLiterals: false
decisionPoints:
  - id: state-behaviour
    question: How does behaviour depend on machine state?
    approaches:
      - id: state-pattern
        name: The State pattern
        signals: [state interface, Idle, HasMoney or Dispensing classes]
        tradeoff: Each state is isolated; more classes for a small machine.
      - id: enum-switch
        name: An enum with a switch
        signals: [enum of states, switch on the state]
        tradeoff: Compact, but adding a state edits every switch.
      - id: boolean-flags
        name: Boolean flags
        signals: [fields such as hasMoney and hasSelection]
        tradeoff: Quick to write, but invalid combinations are easy to reach.
  - id: change-making
    question: How is change made?
    approaches:
      - id: change-strategy
        name: A change strategy
        signals: [interface for making change, greedy implementation]
        tradeoff: Easy to swap the algorithm; one more type.
      - id: inline-greedy
        name: A greedy loop inline
        signals: [loop over denominations inside the machine class]
        tradeoff: Simple, but mixed into the machine and hard to test alone.
      - id: hardcoded-list
        name: A hard-coded denomination list
        signals: [array of numbers in the code]
        tradeoff: Fast to write, but changing denominations means editing code.
  - id: payment-model
    question: How is payment modelled?
    approaches:
      - id: payment-abstraction
        name: A payment abstraction
        signals: [Payment interface, Cash implementation]
        tradeoff: Adding card payments is a new class; more up-front design.
      - id: coins-only
        name: Coins only
        signals: [balance field, insertMoney adds to it]
        tradeoff: Smallest design, but card payments would need broad changes.
changeRequest:
  id: card-payments
  text: Add card payments alongside cash. A card sale needs no change and can be declined.
