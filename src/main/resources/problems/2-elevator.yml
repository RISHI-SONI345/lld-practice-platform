decisionPoints:
  - id: dispatch-strategy
    question: Which elevator serves a call?
    approaches:
      - id: nearest-car
        name: A dispatch strategy such as nearest car
        signals: [interface for choosing an elevator, nearest or least-busy implementations]
        tradeoff: Easy to swap; one more type.
      - id: fixed-rule
        name: A fixed rule inside the controller
        signals: [loop with a distance comparison in the controller]
        tradeoff: Simple, but every policy change edits the controller.
      - id: round-robin
        name: Round robin
        signals: [index that cycles through elevators]
        tradeoff: Fair and trivial, but ignores distance and direction.
  - id: car-behaviour
    question: How does a car behave by state?
    approaches:
      - id: state-pattern
        name: The State pattern
        signals: [state interface, Idle, MovingUp, MovingDown or DoorsOpen classes]
        tradeoff: Each state is isolated; more classes for a small machine.
      - id: enum-switch
        name: An enum with a switch
        signals: [enum of states, switch on the state]
        tradeoff: Compact, but adding a state edits every switch.
      - id: boolean-flags
        name: Boolean flags
        signals: [fields such as moving and doorsOpen]
        tradeoff: Quick to write, but impossible states become easy to reach.
  - id: stop-holding
    question: How are stops held?
    approaches:
      - id: sorted-per-direction
        name: Sorted stops per direction
        signals: [TreeSet or sorted list for up and for down]
        tradeoff: Gives sweep behaviour naturally; two collections to keep in sync.
      - id: fifo-queue
        name: A FIFO queue
        signals: [Queue of floors]
        tradeoff: Simple and fair, but the car zig-zags.
      - id: priority-by-distance
        name: Priority by distance
        signals: [PriorityQueue with a distance comparator]
        tradeoff: Short trips, but far requests can starve.
changeRequest:
  id: service-elevator
  text: Add an elevator that serves only some floors, for example a service elevator. The dispatcher must respect the restriction.
