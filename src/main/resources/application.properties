spring.application.name=lld-practice-platform

# Attempts survive a restart. The test profile uses an in-memory database instead.
spring.datasource.url=jdbc:h2:file:./data/lld-practice;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Set GEMINI_API_KEY to turn on the real AI review. Without it the app runs in clearly labelled demo mode.
lld.llm.gemini.api-key=${GEMINI_API_KEY:}
lld.llm.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
lld.llm.timeout-seconds=60

# Where the problem files live. Adding a problem means adding a file there, not code.
lld.problems.location=classpath:problems/*.yml

server.error.include-message=never
