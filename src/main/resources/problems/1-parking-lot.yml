capabilities:
  - id: assign-spot
    description: assign a spot to a vehicle
    nameHints: [assign, allocate, find, reserve, park]
    watchLiterals: false
  - id: release-spot
    description: release a spot when a vehicle leaves
    nameHints: [release, vacate, free, unpark, exit]
    watchLiterals: false
  - id: compute-fee
    description: compute the parking fee
    nameHints: [fee, charge, price, cost, rate, bill]
    watchLiterals: true
  - id: track-capacity
