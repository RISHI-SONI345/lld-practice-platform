id: elevator
title: Elevator System
statement: Design a building with several elevators, a dispatcher, and a tick-based simulation.
requirements:
  - A building has several floors and several elevators.
  - A person can call an elevator at a floor, asking to go up or down. A person inside an elevator can select a destination floor.
  - A dispatcher decides which elevator serves a call.
  - An elevator moves one floor per tick, stops at requested floors, and opens and closes its doors.
  - An elevator keeps its direction while there are stops ahead, then reverses or goes idle.
  - An elevator has a passenger limit. A request that would exceed it is refused with a reason.
  - A request for a floor that does not exist is rejected.
  - The simulation is tick-based so the design needs no threads and every run is repeatable.
