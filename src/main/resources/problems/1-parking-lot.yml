id: parking-lot
title: Parking Lot
statement: Design a multi-floor parking lot that assigns spots, issues tickets and charges a fee on exit.
requirements:
  - A lot has several floors, each with spots of different sizes.
  - Vehicles are motorcycles, cars and trucks. A vehicle may only use a spot that fits it.
  - On entry the system assigns a spot and issues a ticket. If nothing fits, entry is refused with a clear reason.
  - On exit the system computes the fee from entry time, exit time and vehicle type, then frees the spot. Part hours round up.
  - Hourly rates differ by vehicle type.
  - The system can report free spots per floor.
  - An unknown or already-used ticket is rejected at exit.
entryTypes:
  - ParkingLotService
