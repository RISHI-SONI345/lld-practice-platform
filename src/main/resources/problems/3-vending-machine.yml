id: vending-machine
title: Vending Machine
statement: Design a vending machine that takes money, dispenses products and returns change.
requirements:
  - A machine has coded slots, each holding one product with a price and a quantity.
  - A user selects a product, inserts money in accepted denominations, and the machine dispenses the product and returns change.
  - Insufficient money, a sold-out slot and an unknown code are reported clearly.
  - A user can cancel before dispensing and gets all inserted money back.
  - If exact change cannot be made, the machine refuses the sale and refunds.
  - An operator can restock a slot.
entryTypes:
  - VendingMachine
